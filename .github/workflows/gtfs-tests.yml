#
# .github/workflows/gtfs-tests.yml
#
# GeoAlarm — CI
#
# Jobs
# ────
# unit-tests   Runs on every push + PR.
#              Executes the WHOLE NapStopTests target EXCEPT the two GTFS
#              network suites (GTFSFeedURLTests / GTFSParserTests), which have
#              their own jobs. Using -only-testing:NapStopTests + -skip-testing
#              (rather than a hand-maintained per-class allow-list) guarantees
#              newly added test classes — e.g. ETAEstimatorTests, LocalizationTests,
#              LocalizationConsistencyTests, CoordinateParserTests — are picked
#              up automatically instead of silently dropping out.
#              Covers alarm model, view-model validation, AlarmManager CRUD,
#              time-based/ETA engine, sound→AlarmKit mapping, Auto-Notify,
#              coordinate parsing, localization integrity (spot-checked tokens
#              AND structural key-parity/format-specifier/duplicate-key checks
#              across all 13 languages), and sound/Info.plist regression guards.
#              Requires no network access. Completes in ~2-3 min.
#              Runs with -enableCodeCoverage YES; the .xcresult (with
#              per-file/per-line coverage) is uploaded as the unit-test-coverage
#              artifact so a class silently missing tests shows up as a
#              visible coverage gap, not just an absence nobody notices
#              (2026-07-05 — previously recommended, not applied until now).
#
# url-checks   Runs on every push + PR.
#              Executes GTFSFeedURLTests — lightweight HEAD/range-GET checks
#              for all 29 curated feeds.  Completes in ~60 s.
#
# parse-tests  Runs only on push to main, or when manually triggered.
#              Executes GTFSParserTests — full download + parse for 4 select
#              feeds (MARTA, BART, DB Fernverkehr, TriMet).  Takes 3–5 minutes.
#
# ui-tests     Runs on every push + PR.
#              Executes NapStopUITests — empty state, add/delete/disable alarm,
#              and the in-app language-switch view-identity smoke test. Was
#              flagged as a gap (target existed, never run by CI) in the
#              2026-07-05 audit; wired in the same day after finding — and
#              fixing at the source — several ways the suite had drifted out
#              of runnable state (stale empty-state string, a button lookup
#              that never matched anything, an unimplemented reset flag, and
#              onboarding blocking every test on a fresh simulator). See
#              NapStopUITests.swift's header for the full list. Slower and
#              more environment-sensitive than the unit-test suite by nature
#              (XCUITest drives the real UI) — expect this job to need the
#              most post-merge triage of the four if the first run is red.
#
# Security note
# ─────────────
# This workflow uses only ${{ secrets.GITHUB_TOKEN }} (the auto-generated token
# provided by GitHub Actions).  Never commit personal access tokens or API keys
# to this file.

name: GeoAlarm CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      run_parse_tests:
        description: "Run full parse tests (slow, downloads real feeds)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# Cancel any in-flight run for the same branch/PR when a new commit arrives.
concurrency:
  group: gtfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1 — Core unit tests (every commit, no network required)
  # Covers alarm model, view-model validation, AlarmManager CRUD + state
  # transitions, notification userInfo embedding/recovery, sound defaults,
  # and Info.plist regression guards.
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GeoAlarm.xcodeproj \
            -scheme GeoNap

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project GeoAlarm.xcodeproj \
            -scheme GeoNap \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:NapStopTests \
            -skip-testing:NapStopTests/GTFSFeedURLTests \
            -skip-testing:NapStopTests/GTFSParserTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color --report junit --output test-results-unit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results-unit.xml
          retention-days: 14

      # .xcresult carries per-file/per-line coverage. Uploading it (rather
      # than just a coverage %) makes silent coverage regressions visible —
      # e.g. a whole new class added without tests — instead of only
      # noticing when a hand-maintained allow-list drops it from CI entirely
      # (the exact failure mode fixed in gtfs-tests.yml on 2026-06-29).
      # Open locally with: xcrun xccov view --report TestResults.xcresult
      - name: Upload coverage bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: TestResults.xcresult
          retention-days: 14

      - name: Print coverage summary
        if: always()
        run: |
          xcrun xccov view --report --only-targets TestResults.xcresult || true

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2 — URL reachability checks (every commit)
  # ──────────────────────────────────────────────────────────────────────────
  url-checks:
    name: GTFS URL Reachability
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GeoAlarm.xcodeproj \
            -scheme GeoNap

      - name: Run URL reachability tests
        run: |
          xcodebuild test \
            -project GeoAlarm.xcodeproj \
            -scheme GeoNap \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:NapStopTests/GTFSFeedURLTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color --report junit --output test-results-url.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: url-check-results
          path: test-results-url.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2 — Full download + parse (main branch + manual trigger only)
  # ──────────────────────────────────────────────────────────────────────────
  parse-tests:
    name: GTFS Full Parse
    runs-on: macos-15
    timeout-minutes: 30
    # Run on push to main, or when manually triggered with run_parse_tests=true.
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_parse_tests == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GeoAlarm.xcodeproj \
            -scheme GeoNap

      - name: Run full-parse tests
        run: |
          xcodebuild test \
            -project GeoAlarm.xcodeproj \
            -scheme GeoNap \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:NapStopTests/GTFSParserTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color --report junit --output test-results-parse.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parse-test-results
          path: test-results-parse.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4 — UI tests (every commit)
  # Empty state, add/delete/disable alarm, and the language-switch smoke test.
  # ──────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: UI Tests
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GeoAlarm.xcodeproj \
            -scheme GeoNap

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project GeoAlarm.xcodeproj \
            -scheme GeoNap \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:NapStopUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color --report junit --output test-results-ui.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: test-results-ui.xml
          retention-days: 14

      # XCUITest failures are far more legible from the screenshot/hierarchy
      # dump than from the JUnit XML alone — xcodebuild writes these into the
      # .xcresult automatically on failure.
      - name: Upload UI test result bundle (screenshots on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-xcresult
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 14
          if-no-files-found: ignore
